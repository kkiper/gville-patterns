name: Find TVA data sources (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless Chrome
        run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Record TVA page data requests
        run: node tools/discover-tva.mjs
      - name: Commit findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tva-discovery.json
          git diff --cached --quiet || (git commit -m "data: TVA data source discovery" && git pull --rebase && git push)

name: Update lake data

on:
  schedule:
    - cron: '7 * * * *'   # every hour at :07 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Lake outline (first run only)
        run: node scripts/fetch-outline.mjs
      - name: Fetch distances
        run: node scripts/build-fetch.mjs
      - name: Weather
        run: node scripts/fetch-weather.mjs
      - name: Water
        run: node scripts/fetch-water.mjs
      - name: Validate patterns
        run: node scripts/validate-patterns.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: hourly update" && git push)
